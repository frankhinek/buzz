[advisories]
ignore = [
    # instant 0.1.13 — unmaintained crate. Transitive dep: nostr → instant.
    # Will be resolved when nostr crate updates its dependencies.
    { id = "RUSTSEC-2024-0384", reason = "transitive dep via nostr; no upstream fix available" },
    # paste 1.0.15 — unmaintained. Transitive dep: mesh-llm → iroh → netlink-* → paste.
    # No safe upgrade available; tracked for upstream (iroh/netlink) replacement.
    { id = "RUSTSEC-2024-0436", reason = "transitive dep via mesh-llm → iroh → netlink; no upstream fix available" },
    # quick-xml < 0.41: quadratic runtime on duplicate-attribute check (0194) and
    # unbounded namespace-declaration allocation in NsReader (0195). Both DoS-class,
    # requiring attacker-controlled XML. Our two locked versions only parse trusted
    # input: 0.38.4 (rust-s3/aws-creds — responses from our own S3/MinIO endpoint)
    # and 0.39.4 (mesh-llm → iroh → netdev → plist — local macOS system plists).
    # Patched release (>= 0.41.0) is unreachable until rust-s3 and plist/netdev bump;
    # remove these when upstream catches up.
    { id = "RUSTSEC-2026-0194", reason = "transitive via rust-s3 and mesh-llm→plist; trusted-input XML only; no upstream fix available yet" },
    { id = "RUSTSEC-2026-0195", reason = "transitive via rust-s3 and mesh-llm→plist; trusted-input XML only; no upstream fix available yet" },
    # hickory-proto 0.25.2: NSEC3 unbounded loop (0118) and O(n²) name
    # compression (0119). Both DoS-class, in DNS validation/encoding paths.
    # Transitive dep: buzz-ecash → fedimint-connectors → iroh 0.90 (exact-
    # pinned), which pins hickory-proto 0.25; the fixed 0.26 line is already
    # used by our own iroh 1.x. Remove when fedimint bumps past iroh 0.90.
    { id = "RUSTSEC-2026-0118", reason = "transitive via fedimint-connectors→iroh 0.90; DoS-class; fixed line unreachable until fedimint bumps iroh" },
    { id = "RUSTSEC-2026-0119", reason = "transitive via fedimint-connectors→iroh 0.90; DoS-class; fixed line unreachable until fedimint bumps iroh" },
    # rustls-webpki 0.102.8 — four cert-validation advisories (0049/0098/0099/
    # 0104). Duplicate old version pulled only by buzz-ecash → fedimint-
    # connectors → iroh 0.35 (exact-pinned); Buzz's own TLS paths use the
    # fixed 0.103 line. No patched 0.102.x exists. Remove when fedimint bumps iroh.
    { id = "RUSTSEC-2026-0049", reason = "old duplicate via fedimint-connectors→iroh 0.35; buzz TLS uses fixed 0.103; no patched 0.102.x" },
    { id = "RUSTSEC-2026-0098", reason = "old duplicate via fedimint-connectors→iroh 0.35; buzz TLS uses fixed 0.103; no patched 0.102.x" },
    { id = "RUSTSEC-2026-0099", reason = "old duplicate via fedimint-connectors→iroh 0.35; buzz TLS uses fixed 0.103; no patched 0.102.x" },
    { id = "RUSTSEC-2026-0104", reason = "old duplicate via fedimint-connectors→iroh 0.35; buzz TLS uses fixed 0.103; no patched 0.102.x" },
    # atomic-polyfill 1.0.3 — unmaintained. Target-gated embedded fallback under
    # heapless 0.7 (edge surfaced by iroh-base 0.35 feature unification); never
    # compiled for any supported Buzz target.
    { id = "RUSTSEC-2023-0089", reason = "target-gated embedded dep under heapless 0.7; never compiled for supported targets" },
    # proc-macro-error 1.0.4 — unmaintained. Compile-time only, via aquamarine
    # (doc-comment diagrams) in fedimint-client-module; no runtime code.
    { id = "RUSTSEC-2024-0370", reason = "compile-time doc macro via aquamarine in fedimint tree; no runtime exposure" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MITNFA",
    "MPL-2.0",
    "BSL-1.0",
    "Unlicense",
    # minicbor's permissive, OSI-approved license. Used for strict App Attest
    # assertion CBOR parsing and also transitively by appattest.
    "BlueOak-1.0.0",
    # bzip2/libbzip2's permissive BSD-like license. New via desktop zip/bzip2
    # transitive deps; compatible with Apache-2.0 distribution.
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

# mesh-llm workspace crates (pinned git dep) omit a per-crate `license` field in
# their manifests, so cargo-deny reports them as unlicensed. The mesh-llm repo is
# licensed "MIT OR Apache-2.0" (workspace Cargo.toml + top-level LICENSE = Apache-2.0);
# clarify each pulled-in member to that expression. Remove once mesh sets the field
# upstream (filed).
[[licenses.clarify]]
crate = "mesh-llm-config"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "mesh-llm-gpu-bench"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "mesh-llm-host-runtime"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "mesh-llm-plugin"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "mesh-llm-system"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "mesh-mixture-of-agents"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "buzz-desktop"
expression = "Apache-2.0"
license-files = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
